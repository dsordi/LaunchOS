<style>
  :root{

    --nav:#001326; --nav-ink:#cbd8e6; --nav-active:#FF8C00;
    --accent:#FF8C00; --accent-soft:rgba(255,140,0,.22); --cyan:#00FFFF; --yellow:#FFD700;
    --good:#34d399; --good-bg:rgba(16,185,129,.14); --warn:#FFD700; --warn-bg:rgba(255,215,0,.10); --bad:#ff7a7a; --bad-bg:rgba(239,68,68,.14);
    --a:#3b82f6; --b:#10b981; --c:#a78bfa; --d:#fb923c;
    --fhead:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
    background-image:linear-gradient(to right,rgba(0,255,255,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,255,255,.035) 1px,transparent 1px);background-size:42px 42px;background-attachment:fixed}
  .glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
  .glow.o{top:-8%;right:5%;width:460px;height:460px;background:radial-gradient(circle,rgba(255,140,0,.13) 0%,rgba(0,26,51,0) 70%)}
  .glow.c{top:38%;left:-6%;width:440px;height:440px;background:radial-gradient(circle,rgba(0,255,255,.09) 0%,rgba(0,26,51,0) 70%)}
  .app{display:flex;min-height:100vh;position:relative;z-index:1}
  aside{width:236px;background:var(--nav);color:var(--nav-ink);padding:20px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid rgba(0,255,255,.08)}
  aside .brand{display:flex;align-items:center;gap:10px;color:#fff;padding:4px 6px 18px}
  aside .brand .rk{width:40px;height:40px;flex-shrink:0;background:rgba(0,51,102,.7);border:1px solid rgba(0,255,255,.3);border-radius:11px;padding:5px;box-shadow:0 0 18px rgba(0,255,255,.18)}
  aside .brand .nm{font-family:var(--fhead);font-weight:800;font-size:19px;letter-spacing:-.3px;line-height:1}
  aside .brand .nm .os{color:var(--accent)}
  aside .brand small{display:block;font-weight:500;font-size:8.5px;color:rgba(0,255,255,.75);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  nav a{display:block;padding:9px 11px;border-radius:9px;color:var(--nav-ink);text-decoration:none;font-size:13px;margin-bottom:2px;cursor:pointer;transition:all .15s}
  nav a:hover{background:rgba(0,255,255,.07);color:#fff}
  nav a.active{background:var(--accent);color:#fff;box-shadow:0 0 18px rgba(255,140,0,.35);font-weight:600}
  nav .sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5d7a99;padding:14px 11px 5px}
  aside .foot{font-size:10.5px;color:#6d87a3;padding:16px 10px 0;border-top:1px solid rgba(0,255,255,.1);margin-top:16px}
  main{flex:1;padding:26px 30px;max-width:1120px}

  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}

  .card h2 .tag{font-family:'Inter';font-size:10px;font-weight:600;color:var(--cyan);background:rgba(0,255,255,.08);border:1px solid var(--line);padding:1px 7px;border-radius:20px;margin-left:7px;vertical-align:middle}

  input,select{width:100%;padding:8px 9px;border:1px solid rgba(0,255,255,.18);border-radius:8px;font-size:13px;background:#001326;color:var(--ink)}

  .chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.neutral{background:rgba(255,255,255,.07);color:var(--muted)}
  .mark{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;vertical-align:middle}

  .party-row{display:grid;grid-template-columns:1fr 90px auto auto;gap:8px;align-items:center;margin-bottom:7px}
  .rede-row{display:grid;grid-template-columns:140px 1fr 130px 110px auto;gap:8px;align-items:center;margin-bottom:7px}
  .muted{color:var(--muted)}
  .pill-note{font-size:11px;color:var(--muted);background:rgba(0,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
  .statbar{display:flex;gap:18px;flex-wrap:wrap;background:#001326;color:var(--ink);border-radius:10px;padding:12px 16px;margin:10px 0;border:1px solid rgba(0,255,255,.15)}
  .statbar .s b{font-family:var(--fhead);display:block;font-size:18px;color:#fff} .statbar .s span{font-size:11px;color:var(--muted)}
  .biblio li{margin-bottom:7px}
  @media(max-width:720px){.app{flex-direction:column}aside{width:auto;height:auto;position:static}main{padding:18px}.scenarios{grid-template-columns:1fr}.rede-row{grid-template-columns:1fr 1fr}}
  /* pitch / relatório (adicionado) */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:1000}
  .modal{background:#fff;color:#0f172a;max-width:800px;width:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal .modal-actions{position:sticky;top:0;background:#fff;display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-bottom:1px solid #e2e8f0;border-radius:14px 14px 0 0}
  .modal .btn.ghost{background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1}
  .pitch{padding:22px 34px 38px;color:#0f172a}
  .pitch h1{font-family:var(--fhead);font-size:23px;margin:0 0 3px;color:#0f172a} .pitch .lead{color:#64748b;margin:0 0 6px}
  .pitch h2{font-family:var(--fhead);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#c2410c;border-bottom:2px solid #fed7aa;padding-bottom:4px;margin:22px 0 10px}
  .pitch ul{margin:0;padding-left:18px} .pitch li{margin-bottom:5px}
  .pitch b{color:#0f172a} .pitch .muted{color:#64748b}
  .pitch table{width:100%;border-collapse:collapse;font-size:13px} .pitch td,.pitch th{padding:6px 8px;border-bottom:1px solid #e2e8f0;text-align:left;color:#0f172a} .pitch th{font-size:11px;text-transform:uppercase;color:#64748b}
  .pitch .disc{font-size:11px;color:#475569;background:#f1f5f9;border:none;border-radius:8px;margin-top:20px;padding:12px 14px}
  .pitch .alertbox{background:#fef3c7;border:1px solid #fcd34d;color:#713f12}
  @media print{ body>.app{display:none!important} .glow{display:none!important} .modal-overlay{position:static;background:none;padding:0;display:block;overflow:visible} .modal{box-shadow:none;max-width:none} .modal .modal-actions{display:none!important} }

<body>
<div class="glow o"></div>
<div class="glow c"></div>
<div class="app">
  <aside>
    <div class="brand">
      <div class="rk"><svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
        <path d="M50 10C65 25 75 45 70 70L50 60L30 70C25 45 35 25 50 10Z" fill="url(#rg)"/>
        <circle cx="50" cy="32" r="3" fill="#00FFFF"/><circle cx="42" cy="45" r="2.5" fill="#00FFFF"/><circle cx="58" cy="45" r="2.5" fill="#00FFFF"/>
        <line x1="50" y1="32" x2="42" y2="45" stroke="#00FFFF" stroke-width="1.5"/><line x1="50" y1="32" x2="58" y2="45" stroke="#00FFFF" stroke-width="1.5"/><line x1="50" y1="32" x2="50" y2="55" stroke="#00FFFF" stroke-width="1.5"/>
        <path d="M30 55L15 68L28 72L33 62Z" fill="#003366" stroke="#00FFFF" stroke-width="1"/><path d="M70 55L85 68L72 72L67 62Z" fill="#003366" stroke="#00FFFF" stroke-width="1"/>
        <path d="M40 65C40 65 50 90 50 90C50 90 60 65 60 65C55 70 45 70 40 65Z" fill="url(#fg)"/><path d="M45 65C45 65 50 80 50 80C50 80 55 65 55 65C52 68 48 68 45 65Z" fill="#FFD700"/>
        <defs><linearGradient id="rg" x1="50" y1="10" x2="50" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#00FFFF"/><stop offset="0.6" stop-color="#003366"/><stop offset="1" stop-color="#001A33"/></linearGradient><linearGradient id="fg" x1="50" y1="65" x2="50" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#FF8C00"/><stop offset="1" stop-color="#FFD700"/></linearGradient></defs>
      </svg></div>
      <div><div class="nm">Launch<span class="os">OS</span></div><small>Inteligência p/ seu Lançamento Digital</small></div>
    </div>
    <nav id="nav">
      <div class="sec">Operação</div>
      <a data-view="list" class="active">📋 Oportunidades</a>
      <a data-view="new">➕ Nova oportunidade</a>
      <a data-view="gerador">🚀 Estrutura de lançamento</a>
      <div class="sec">Conhecimento</div>
      <a data-view="biblio">📚 Princípios da base</a>
    </nav>
    <div class="foot">
      Modelo: assinatura recorrente · sem reembolso integral.<br>Todo número é premissa <b style="color:#fb923c">[D]</b>, não previsão.<br><br>v1.1 · 2026-10-28
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ---------------- storage ---------------- */
const KEY='launchos_opps_v2';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=(a)=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
let opps=load();
let current=null;

/* ---------------- helpers ---------------- */
const brl=(n)=>isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const num=(n,d=0)=>isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const pct=(n)=>isFinite(n)?(n*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%':'—';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=(s)=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function blankOpp(){
  return {
    id:uid(), nome:'', nicho:'', hipotese:'',
    // influenciador / redes sociais
    redes:[{rede:'Instagram',handle:'',seguidores:0,engaj:0}],
    alcancePct:10, intencao:'baixa',
    // produto (SEMPRE assinatura) + política de cancelamento
    produtoNome:'', rendaVariavel:false,
    ticketMensal:300, prazoFidelidade:12, churnMensalPct:5, cancel7Pct:10, multaPct:50,
    planos:null,  // formatos de comercialização [{nome,meses,ticketMensal,mix}]
    // aquisição / leads
    optinPct:5, verbaTrafego:20000, cpl:8, qtdLeadsDB:0, custoLeadDB:1.60, convLista:2,
    // modelo
    modelo:'interno',
    // custos / regras
    taxaPlataformaPct:10, producao:5000, ferramentas:1000, outrosFixos:0,
    impostoPct:10, impostoBase:'faturamento',
    hairConserv:30, hairOtim:20,
    // revenue share
    splitBase:'lucro', recuperaInvest:false, investRecuperar:0, parceirosNote:'',
    partes:[{nome:'Nelogica',pct:100,operador:true}],
    // execução (E6/E7)
    dataCarrinho:'', plano:null,
    status:'rascunho'
  };
}

/* ---------------- motor financeiro (determinístico) ---------------- */
const seguidoresTotais=(o)=>(o.redes||[]).reduce((a,r)=>a+(+r.seguidores||0),0);
const audienciaAlcancavel=(o)=>seguidoresTotais(o)*((o.alcancePct||0)/100);

// formatos de comercialização do produto (1 produto, vários planos)
function getPlanos(o){
  if(o.planos && o.planos.length) return o.planos;
  return [{nome:'Plano único', meses:(+o.prazoFidelidade||12), ticketMensal:(+o.ticketMensal||0), mix:100, churn:0}];
}
// receita por cliente de UM formato, ao longo do seu prazo, com multa sobre o restante em cancelamentos pós-janela
// receita por cliente de UM formato (modelo A): churn TOTAL do período sobre o valor,
// com multa. Quem completa paga 100% do período; quem churna paga a multa sobre o valor.
// Receita = valorPeríodo × (1 − churn × (1 − multa))
function recPlano(o,p){
  const valorPeriodo=(+p.ticketMensal||0)*Math.max(1,Math.round(+p.meses||12));
  const churn=(+p.churn||0)/100, m=(+o.multaPct||0)/100;
  return valorPeriodo*(1 - churn*(1-m));
}
// receita esperada por cliente efetivo = média ponderada dos formatos pelo mix
function receitaPorCliente(o){
  const pl=getPlanos(o), tot=pl.reduce((a,p)=>a+(+p.mix||0),0)||1;
  return pl.reduce((a,p)=>a+recPlano(o,p)*((+p.mix||0)/tot),0);
}
// ticket mensal médio ponderado (para payback/CAC)
function ticketMensalBlend(o){
  const pl=getPlanos(o), tot=pl.reduce((a,p)=>a+(+p.mix||0),0)||1;
  return pl.reduce((a,p)=>a+(+p.ticketMensal||0)*((+p.mix||0)/tot),0);
}
// ticket médio simples: soma dos tickets dos formatos ÷ nº de formatos (para exibição na Carteira)
function ticketMedio(o){
  const pl=getPlanos(o), n=pl.length||1;
  return pl.reduce((a,p)=>a+(+p.ticketMensal||0),0)/n;
}

function computeScenario(o, convMult){
  const conv=(o.convLista/100)*convMult;
  const leadsAud = audienciaAlcancavel(o)*((o.optinPct||0)/100);
  const leadsPagos = o.cpl>0 ? o.verbaTrafego/o.cpl : 0;
  const leadsDB = +o.qtdLeadsDB||0;
  const leads = leadsAud+leadsPagos+leadsDB;
  const vendas = leads*conv;
  const efetivos = vendas*(1-(o.cancel7Pct||0)/100);       // passaram dos 7 dias
  const recPorCliente = receitaPorCliente(o);
  const bruto = efetivos*recPorCliente;                    // receita contratada esperada (ao longo do termo)
  const receita = bruto;                                   // sem reembolso integral: receita = contratada
  const taxaPlat = receita*((o.taxaPlataformaPct||0)/100);
  const leadsDBCost = leadsDB*(+o.custoLeadDB||0);         // contribuição Nelogica (base de leads)
  const fixos = (+o.verbaTrafego||0)+(+o.producao||0)+(+o.ferramentas||0)+(+o.outrosFixos||0);
  const antesImp = receita - taxaPlat - fixos - leadsDBCost;
  const baseImp = o.impostoBase==='faturamento'?receita:Math.max(0,antesImp);
  const imposto = baseImp*((o.impostoPct||0)/100);
  const lucro = antesImp - imposto;
  const custosTotais = taxaPlat+fixos+leadsDBCost+imposto;
  // unit economics (assinatura) — CAC é CALCULADO (o usuário não estima)
  const custoAquisicao = (+o.verbaTrafego||0) + leadsDBCost;     // mídia + base de leads
  const cac = efetivos>0 ? custoAquisicao/efetivos : 0;
  const taxRev = o.impostoBase==='faturamento' ? ((o.impostoPct||0)/100) : 0;
  const netMensal = ticketMensalBlend(o)*(1-((o.taxaPlataformaPct||0)/100)-taxRev); // margem mensal por cliente (ponderada entre formatos)
  const paybackMeses = netMensal>0 ? cac/netMensal : Infinity;
  const ltvCac = cac>0 ? recPorCliente/cac : Infinity;
  return {conv,leadsAud,leadsPagos,leadsDB,leads,vendas,efetivos,recPorCliente,bruto,receita,taxaPlat,leadsDBCost,fixos,antesImp,imposto,lucro,custosTotais,custoAquisicao,cac,netMensal,paybackMeses,ltvCac};
}

function distribute(o,s){
  const partes=o.partes; const opIdx=Math.max(0,partes.findIndex(p=>p.operador));
  const base = o.splitBase==='receita'? s.receita : s.lucro;
  let recovered=0;
  if(o.recuperaInvest) recovered=Math.min(+o.investRecuperar||0, Math.max(0,base));
  const distributable = base - recovered;
  const nets=partes.map((p,i)=>{
    let v=distributable*((+p.pct||0)/100);
    if(i===opIdx){ v+=recovered; if(o.splitBase==='receita') v-=s.custosTotais; }
    return v;
  });
  const operadorNet=nets[opIdx]||0;
  const repasseParceiros=partes.reduce((a,p,i)=> i===opIdx?a:a+distributable*((+p.pct||0)/100),0);
  const estouro=(o.splitBase==='receita' && operadorNet<0 && s.lucro>=0);
  return {nets,operadorNet,opIdx,recovered,repasseParceiros,estouro};
}

function breakEvenConv(o){
  const base=o.convLista; if(base<=0) return null;
  const at0=computeScenario(o,0).lucro;
  const at1=computeScenario(o,1).lucro;
  const slope=(at1-at0)/base; if(slope===0) return null;
  return -at0/slope;
}

function analyze(o){
  const b=computeScenario(o,1), cons=computeScenario(o,1-(o.hairConserv/100)), otim=computeScenario(o,1+(o.hairOtim/100));
  const dB=distribute(o,b), dC=distribute(o,cons), dO=distribute(o,otim);
  const be=breakEvenConv(o);
  let verdict,vclass,vmsg;
  if(dC.operadorNet>=0){verdict='VIÁVEL (condicional)';vclass='good';vmsg='O operador fica positivo mesmo no cenário conservador. Mas os números são premissas [D] — confirme conversão, churn e alcance antes de comprometer a verba.';}
  else if(dO.operadorNet<0){verdict='NO-GO';vclass='bad';vmsg='O operador fica negativo até no cenário otimista. Redesenhar oferta/modelo/split ou interromper.';}
  else{verdict='NÃO DECIDÍVEL — TESTAR';vclass='warn';vmsg='O resultado troca de sinal entre conservador e otimista. Depende de uma premissa que você ainda não tem. Rode um teste pequeno antes de decidir.';}
  let sens=null; if(be!=null){sens={be,margem:(o.convLista-be)/o.convLista};}
  return {b,cons,otim,dB,dC,dO,be,sens,verdict,vclass,vmsg};
}

function field(o,label,key,opts={}){
  const t=opts.type||'number';
  if(t==='select'){const options=opts.options.map(([v,l])=>`<option value="${v}" ${o[key]==v?'selected':''}>${l}</option>`).join('');
    return `<div><label>${label} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><select data-k="${key}">${options}</select></div>`;}
  if(t==='check') return `<div><label>&nbsp;</label><div class="row-inline"><input type="checkbox" style="width:auto" data-k="${key}" ${o[key]?'checked':''}/> <span>${label}</span></div></div>`;
  const suf=opts.suffix?`<span class="muted" style="font-size:11px"> ${opts.suffix}</span>`:'';
  return `<div><label>${label}${suf} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><input type="${t}" data-k="${key}" value="${esc(o[key])}" ${t==='text'?'':'step=any'}/></div>`;
}

const addDays=(dateStr,d)=>{if(!dateStr)return'';const dt=new Date(dateStr+'T00:00:00');if(isNaN(dt))return'';dt.setDate(dt.getDate()+d);return dt.toLocaleDateString('pt-BR');};
const planoStats=(o)=>{const t=o.plano||[];const done=t.filter(x=>x.feito).length;return{done,total:t.length,pct:t.length?done/t.length:0};};

function renderPlanoBody(o){
  const s=analyze(o).b;
  const metas=[`alvo ≈ ${num(s.leads)} leads`,'alvo: presença/abertura altas (termômetro)',`alvo ≈ ${num(s.efetivos,0)} clientes efetivos`,'alvo: cancelamento ≤ premissa; aprendizados registrados'];
  const st=planoStats(o);
  // portão de compliance pendente?
  const compPend = o.rendaVariavel && (o.plano||[]).some(t=>t.portao && /jurídico/i.test(t.desc) && !t.feito);
  let html=`<div class="grid" style="margin-bottom:10px">
     <div><label>Data de abertura do carrinho (D0)</label><input type="date" id="dataCarrinhoInput" value="${esc(o.dataCarrinho)}"/></div>
     <div><label>Progresso geral</label><div style="padding-top:7px"><b>${st.done}/${st.total}</b> tarefas · ${pct(st.pct)}</div></div>
     <div><label>&nbsp;</label><button class="btn ghost sm" id="genPlano">↻ gerar / resetar plano padrão</button></div>
   </div>`;
  if(compPend) html+=`<div class="alertbox" style="margin-bottom:10px"><b>Portão de compliance aberto:</b> renda variável + validação jurídica não concluída → a copy não pode ser liberada.</div>`;
  [0,1,2,3].forEach(f=>{
    const tasks=(o.plano||[]).map((t,idx)=>({t,idx})).filter(x=>x.t.fase===f);
    const done=tasks.filter(x=>x.t.feito).length;
    html+=`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><b>${FASES[f].nome}</b><span class="muted" style="font-size:12px">${done}/${tasks.length} · ${metas[f]}</span></div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">${FASES[f].obj}</div>`;
    tasks.forEach(({t,idx})=>{
      const quando = o.dataCarrinho? ('📅 '+addDays(o.dataCarrinho,t.dia)) : ('dia '+(t.dia>=0?'D+'+t.dia:'D'+t.dia));
      html+=`<div style="display:grid;grid-template-columns:auto 1fr 120px 64px auto;gap:8px;align-items:center;margin-bottom:5px">
        <input type="checkbox" style="width:auto" data-tk="feito" data-ti="${idx}" ${t.feito?'checked':''}/>
        <input data-tk="desc" data-ti="${idx}" value="${esc(t.desc)}" style="${t.feito?'text-decoration:line-through;color:#94a3b8':''}"/>
        <input data-tk="resp" data-ti="${idx}" value="${esc(t.resp)}" placeholder="responsável"/>
        <input data-tk="dia" data-ti="${idx}" type="number" value="${t.dia}" title="dia relativo ao carrinho (D0)"/>
        <span style="white-space:nowrap">${t.portao?'<span class="chip warn">portão</span> ':''}<button class="btn danger sm" data-trm="${idx}">×</button></span>
        <div style="grid-column:2/6;font-size:11px;color:var(--muted);margin-top:-3px">${quando}</div>
      </div>`;
    });
    html+=`<button class="btn ghost sm" data-addtask="${f}">+ tarefa</button></div>`;
  });
  return html;
}
function bindPlano(o){
  const body=document.getElementById('planoBody'); if(!body)return;
  const refresh=()=>{document.getElementById('planoBody').innerHTML=renderPlanoBody(o);bindPlano(o);};
  body.querySelectorAll('input[data-tk]').forEach(el=>{
    const i=+el.dataset.ti,k=el.dataset.tk;
    if(k==='feito'){el.addEventListener('change',()=>{o.plano[i].feito=el.checked;refresh();});}
    else{el.addEventListener('input',()=>{o.plano[i][k]= k==='dia'?parseFloat(el.value||'0'):el.value;}); if(k==='dia')el.addEventListener('change',refresh);}
  });
  body.querySelectorAll('[data-trm]').forEach(el=>el.onclick=()=>{o.plano.splice(+el.dataset.trm,1);refresh();});
  body.querySelectorAll('[data-addtask]').forEach(el=>el.onclick=()=>{o.plano.push({fase:+el.dataset.addtask,desc:'Nova tarefa',resp:'',dia:0,portao:false,feito:false});refresh();});
  const g=document.getElementById('genPlano'); if(g)g.onclick=()=>{o.plano=defaultPlano();refresh();};
  const dc=document.getElementById('dataCarrinhoInput'); if(dc)dc.addEventListener('change',()=>{o.dataCarrinho=dc.value;refresh();});
}

function bindRedes(o){

function bindParties(o){
  main.querySelectorAll('[data-pk]').forEach(el=>el.addEventListener('input',()=>{const i=+el.dataset.pi,k=el.dataset.pk;o.partes[i][k]=k==='pct'?parseFloat(el.value||'0'):el.value;recompute(o);}));
  main.querySelectorAll('[data-pop]').forEach(el=>el.addEventListener('change',()=>{const i=+el.dataset.pop;o.partes.forEach((p,j)=>p.operador=(j===i));recompute(o);}));
  main.querySelectorAll('[data-prm]').forEach(el=>el.onclick=()=>{const i=+el.dataset.prm;if(o.partes.length<=1)return;const wasOp=o.partes[i].operador;o.partes.splice(i,1);if(wasOp)o.partes[0].operador=true;viewDetail(o);});

function recompute(o){
  const seg=seguidoresTotais(o),aud=audienciaAlcancavel(o),leadsAud=aud*((o.optinPct||0)/100);
  const engMed= seg>0 ? (o.redes||[]).reduce((a,r)=>a+(+r.seguidores||0)*(+r.engaj||0),0)/seg : 0;
  const ss=document.getElementById('socialStats');
  if(ss){ ss.innerHTML=`<div class="s"><b>${num(seg)}</b><span>seguidores (todas as redes)</span></div>
      <div class="s"><b>${num(aud)}</b><span>audiência alcançável (×${o.alcancePct}%)</span></div>
      <div class="s"><b>${num(leadsAud)}</b><span>leads estimados (×${o.optinPct}% opt-in)</span></div>
      <div class="s"><b>${num(engMed,1)}%</b><span>engajamento médio (ponderado)</span></div>`;}
  const pa=document.getElementById('prontAlert');
  if(pa){ let h='';
    if(o.intencao==='baixa') h+=`<div class="alertbox">Intenção de compra baixa: audiência grande não prevê venda. Gere sinal de intenção (lista de espera, enquete) antes de projetar.</div>`;
    if(seg>0 && engMed>0 && engMed<2) h+=`<div class="alertbox">Engajamento médio baixo (${num(engMed,1)}%): <b>seguidores ≠ influência</b>. "Muitos são vistos, mas não ouvidos" — influência rasa não converte (Pissarra, SRC-034 [A]). Pese a interação ativa, não o nº de seguidores.</div>`;
    pa.innerHTML=h; }
  const ca=document.getElementById('compAlert');

  const rn=document.getElementById('recNote');

    rn.innerHTML=`Receita esperada por cliente (<b>média ponderada dos formatos</b>): <b>${brl(rc)}</b>. Por formato: <b>valor do período × (1 − churn×(1−multa))</b> — quem completa paga 100%; quem churna paga a multa de ${o.multaPct}%. ⚠️ Receita contratada [D]; o caixa entra ao longo do período (GAP-008).`;}
  const pn=document.getElementById('planosNote');
  if(pn){const pl=getPlanos(o);const tot=pl.reduce((a,p)=>a+(+p.mix||0),0);const tb=ticketMensalBlend(o);
    pn.innerHTML=`${pl.length} formato(s) · mix soma <b>${num(tot)}%</b>${Math.abs(tot-100)>0.5?' — normalizado para 100% no cálculo':''} · ticket médio ponderado <b>${brl(tb)}/mês</b>. ⚠️ Planos longos (anual/bianual) antecipam caixa e mudam o risco — o fluxo de caixa no tempo ainda não é modelado (GAP-011).<br>💡 <b>[L]</b> Arquitetura de preços (Monetizing Innovation · Kahneman/Ariely): ofereça ~3 níveis (good-better-best); o formato mais longo/caro <b>ancora</b> os demais; evite passar de ~4 opções (paradoxo da escolha).`;}
  const mh=document.getElementById('modeloHint');
  if(mh){const h={semente:'Porta de entrada: valida sem produto pronto. Não tratar como definitivo.',interno:'Cavalo de batalha na própria base. Pré-requisito do externo e do perpétuo.',externo:'Só depois de um interno validado.',perpetuo:'Só depois de um interno de sucesso. Exige tráfego constante.',relampago:'Caixa rápido em base quente. Frequência alta ensina a base a esperar.'};mh.textContent=h[o.modelo]||'';}

  const r=analyze(o), s=r.b, d=r.dB, el=document.getElementById('results'); if(!el)return;
  const line=(l,v,neg=false)=>`<div class="line"><span>${l}</span><span class="${neg?'neg':''}">${neg&&v>0?'− ':''}${brl(v)}</span></div>`;
  const partesOut=o.partes.map((p,i)=>`<div class="line"><span>${esc(p.nome)}${i===d.opIdx?' <span class="muted">(operador)</span>':''} · ${p.pct}%</span><span class="${r.dC.nets[i]<0?'neg':''}">${brl(d.nets[i])}</span></div>`).join('');
  el.innerHTML=`<h2>Resultado <span class="tag">cenário-base · receita contratada</span></h2>
  <div class="verdict ${r.vclass}"><b>${r.verdict}</b><br>${r.vmsg}</div>
  ${d.estouro?`<div class="alertbox"><b>Guard-rail do split:</b> com split sobre a <b>receita</b>, os repasses às outras partes (${brl(d.repasseParceiros)}) deixam o operador <b>negativo</b> embora haja lucro (${brl(s.lucro)}). Risco nº1 da auditoria — reveja a base do split.</div>`:''}
  <div class="scenarios" style="margin:14px 0 4px">
    <div class="scen"><h4>Conservador (−${o.hairConserv}%)</h4><div class="big" style="color:${r.dC.operadorNet<0?'var(--bad)':'var(--good)'}">${brl(r.dC.operadorNet)}</div><div class="muted">operador · lucro ${brl(r.cons.lucro)}</div></div>
    <div class="scen"><h4>Base</h4><div class="big" style="color:${r.dB.operadorNet<0?'var(--bad)':'var(--good)'}">${brl(r.dB.operadorNet)}</div><div class="muted">operador · lucro ${brl(r.b.lucro)}</div></div>
    <div class="scen"><h4>Otimista (+${o.hairOtim}%)</h4><div class="big" style="color:${r.dO.operadorNet<0?'var(--bad)':'var(--good)'}">${brl(r.dO.operadorNet)}</div><div class="muted">operador · lucro ${brl(r.otim.lucro)}</div></div>
  </div>
  <div class="statbar" style="margin-top:14px">
    <div class="s"><b>${brl(s.cac)}</b><span>CAC calculado (mídia+base ÷ clientes)</span></div>
    <div class="s"><b>${isFinite(s.paybackMeses)?num(s.paybackMeses,1)+' meses':'—'}</b><span>payback do CAC</span></div>
    <div class="s"><b>${isFinite(s.ltvCac)?num(s.ltvCac,1)+'x':'—'}</b><span>receita/cliente ÷ CAC</span></div>
    <div class="s"><b>${brl(s.netMensal)}</b><span>margem mensal / cliente</span></div>
  </div>
  ${isFinite(s.paybackMeses)&&s.paybackMeses>o.prazoFidelidade?`<div class="alertbox">⚠️ Payback (${num(s.paybackMeses,1)} meses) maior que a fidelidade (${o.prazoFidelidade} meses): você recupera o CAC <b>depois</b> que o cliente já pode sair. Risco alto de caixa.</div>`:''}
  <div class="pill-note">CAC é <b>calculado</b> (você não precisa estimar): investimento em mídia + custo da base de leads, dividido pelos clientes efetivos. Payback = CAC ÷ margem mensal por cliente. [D] — depende das premissas acima.</div>
  <div class="grid" style="margin-top:14px;align-items:start">

      <div class="line sub"><span>Leads: aud ${num(s.leadsAud)} + mídia ${num(s.leadsPagos)} + base Nelogica ${num(s.leadsDB)}</span><span>${num(s.leads)}</span></div>

function gfield(p,label,key,opts={}){
  const t=opts.type||'text';
  if(t==='select'){const o=opts.options.map(([v,l])=>`<option value="${v}" ${p[key]==v?'selected':''}>${l}</option>`).join('');return `<div><label>${label} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><select data-g="${key}">${o}</select></div>`;}
  if(t==='check')return `<div><label>&nbsp;</label><div class="row-inline"><input type="checkbox" style="width:auto" data-g="${key}" ${p[key]?'checked':''}/> <span>${label}</span></div></div>`;
  return `<div><label>${label} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><input type="text" data-g="${key}" value="${esc(p[key])}"/></div>`;
}
// regras: do produto → tipo de lançamento (matriz 03 + dependências + HYP-005)
const CATINFO={
  profit_addon:{label:'Opcional / ferramenta dentro do Profit',mercado:'base de usuários do Profit (dado interno da Nelogica)',compliance:true,publico:'investidores que já operam no Profit'},

};
function gerarEstrutura(p){
  const validado=p.validado==='sim', jaVende=p.jaVende==='sim', aud=p.audiencia;
  const cat=CATINFO[p.categoria]||CATINFO.outro;
  const publico=esc(p.publico||cat.publico), beneficio=esc(p.paraque||'[benefício central]'), produto=esc(p.oqueeh||p.nome||'[produto]');
  // 1. RAIO-X
  const raiox=[];
  raiox.push({t:'info',txt:`Categoria: <b>${cat.label}</b>. Mercado endereçável = <b>${cat.mercado}</b> — dimensionado de baixo para cima, nunca TAM de cima (regra do projeto; GAP-002).`});
  raiox.push(validado?{t:'ok',txt:'Produto validado — pode vender para a base.'}:{t:'alerta',txt:'Produto não validado — risco de vender algo que o mercado não quer. Validar antes de escalar.'});
  if(aud==='nenhuma') raiox.push({t:'bloqueio',txt:'Sem audiência própria: construir ou emprestar lista antes de qualquer carrinho (captação é pré-requisito).'});
  else if(aud==='fria') raiox.push({t:'alerta',txt:'Audiência fria: aquecer e gerar sinal de intenção antes de ofertar — seguidores ≠ influência (Pissarra, SRC-034).'});
  else raiox.push({t:'ok',txt:'Audiência quente: base relacionada pronta para lançar.'});
  if(cat.compliance||p.rendaVariavel) raiox.push({t:'bloqueio',txt:'Ligado a mercado financeiro (Profit/renda variável): copy e promessas passam por portão jurídico/compliance antes de ir ao ar (GAP-003). <b>Proibido prometer retorno.</b>'});
  const cvpTxt={novo:'Produto novo (introdução, Kotler): foco em informar + induzir a 1ª experimentação; quebra de crença forte.',crescimento:'Em crescimento: escalar alcance e defender posição.',maduro:'Maduro: diferenciar e relançar com ângulo/bônus novo; cuidado com saturação.'};
  if(cvpTxt[p.cvp]) raiox.push({t:'info',txt:cvpTxt[p.cvp]});
  // 2. MERCADO ENDEREÇÁVEL (bottom-up)
  const base=+p.baseAlvo||0, ades=(+p.adesaoPct||0)/100, tk=+p.ticketRef||0, recBase=base*ades*tk;
  const mercado={base,adesPct:+p.adesaoPct||0,tk,ok:base>0&&tk>0,faixa:[recBase*0.6,recBase,recBase*1.6],label:cat.mercado};
  // 3. KOTLER — 5 níveis
  const kotler={niveis:[`<b>Benefício central:</b> ${beneficio} <span class="muted">(o que o cliente realmente compra)</span>`,`<b>Produto básico:</b> ${produto}`,'<b>Produto esperado:</b> [o mínimo que a categoria exige]','<b>Produto ampliado:</b> [o que excede a expectativa — <u>onde você diferencia e surpreende</u>]','<b>Produto potencial:</b> [evolução/roadmap futuro]']};
  // 4. POSICIONAMENTO (Ries&Trout / Dunford)
  const posicionamento={categoriaRef:'[categoria de referência — com o que o cliente compara]',alternativas:'[o que ele usaria se não comprasse]',pod:'[ponto de diferença — o que só você entrega]',pop:'[pontos de paridade — o mínimo que a categoria exige]'};
  // 5. STORYBRAND — BrandScript
  const sb={heroi:publico,desejo:beneficio,probExterno:'[o problema prático que ele enfrenta]',probInterno:'[como isso o faz se sentir]',probFilosofico:'[por que é injusto ele continuar assim]',guia:produto+' — empatia (entendemos sua dor) + autoridade ([prova/credencial])',plano:['[passo 1]','[passo 2]','[passo 3]'],cta:'[ação: assine / entre agora]',fracasso:'[o que ele perde se não agir]',sucesso:'[a transformação que ele alcança]'};
  const mote={frase:`Como ${publico} pode ${beneficio} — mesmo diante de [o maior obstáculo].`};
  // 6. TIPO
  let tipo,just,alt=[];
  if(!validado){tipo='Semente';just='Produto não validado → o semente valida demanda e financia a 1ª turma (matriz 03; SRC-005).';alt=['Interno (após validar)'];}
  else if(aud==='nenhuma'){tipo='Captação + Semente';just='Produto pronto, sem audiência → construir lista primeiro; semente pequeno gera os 1ºs dados.';alt=['Interno (após formar base)'];}
  else if(validado && !jaVende){tipo='Interno';just='Validado + base própria → interno é o cavalo de batalha e pré-requisito de externo/perpétuo (SRC-005/008). Expert com autoridade pula o semente (HYP-005).';alt=['Relâmpago (caixa rápido)'];}
  else {if(p.verba==='alta'||aud==='fria'){tipo='Externo';just='Interno já converte → escalar via afiliados/parceiros (só após interno validado — SRC-005/008).';alt=['Perpétuo (previsibilidade)'];}else{tipo='Perpétuo';just='Interno já converte → automatizar para previsibilidade (só após interno de sucesso).';alt=['Externo (escala)'];}}
  if(p.categoria==='profit_addon'&&validado&&aud!=='nenhuma'&&tipo==='Interno') just+=' Para um opcional do Profit, a própria base de usuários do Profit é o "interno" ideal — audiência quente e qualificada.';
  if(aud==='quente' && !/Relâmpago/.test(alt.join())) alt.push('Relâmpago (caixa rápido, sem abusar da frequência)');
  // 7. PREÇO
  const preco={rec:'Ofereça ~3 formatos (good-better-best); o mais longo/caro (anual/bianual) ancora os demais; evite passar de ~4 opções (paradoxo da escolha).',fonte:'Monetizing Innovation · Kahneman/Ariely [L]'};
  // 8. FASES + PORTÕES
  const fases=estruturaPorTipo(tipo,p);
  const portoes=[];
  if(cat.compliance||p.rendaVariavel) portoes.push('Compliance (Profit/renda variável): validar promessas com o jurídico antes de liberar copy.');
  portoes.push('Tracking/medição configurado ANTES de abrir a captação.');
  portoes.push('Go/no-go financeiro: cenário conservador viável para todas as partes (Decisor E5).');
  portoes.push('Fechar o carrinho na data (escassez honesta).');
  const fontes=['Tipo &amp; sequência: matriz 03 + Jeff Walker (SRC-030) [A]','Mensagem (BrandScript): StoryBrand — Donald Miller (SRC-031) [A]','Produto (5 níveis) &amp; ciclo de vida: Kotler &amp; Keller (SRC-033) [A]','Precificação: Monetizing Innovation / Kahneman-Ariely (biblioteca/12) [L]','Audiência/engajamento: Pissarra (SRC-034) [A]','Dimensionamento bottom-up: regra do projeto (CLAUDE.md) + GAP-002'];
  return {cat,raiox,mercado,kotler,posicionamento,sb,mote,tipo,just,alt,preco,fases,portoes,fontes};
}
function estruturaPorTipo(tipo,p){
  const base=[

      {acao:'Configurar tracking ANTES de abrir a captação [portão]',gatilho:'—',quando:'D-25'}]},
    {nome:'Fase 1 · Aquecimento (pré-lançamento — 3 CPLs)',obj:'Entregar valor, ativar gatilhos, preparar a decisão',passos:[

  return base;

  main.querySelectorAll('[data-g]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.g;p[k]= el.type==='checkbox'?el.checked:el.value;}));
  document.getElementById('loadOpp').addEventListener('change',e=>{const id=e.target.value;if(id){const o=opps.find(x=>x.id===id);if(o){geradorProduto=oppToProduto(o);viewGerador();}}});
  document.getElementById('genEstrut').onclick=()=>{
    const res=gerarEstrutura(p);
    document.getElementById('estrutOut').innerHTML=renderEstrutura(res);
    document.getElementById('estrutPrint').onclick=()=>openReport(renderEstruturaInner(res),'Estrutura de Lançamento — '+(p.nome||p.oqueeh||''));
  };
}

/* ---------------- router ---------------- */
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const v=a.dataset.view;
  if(v==='list')viewList();else if(v==='biblio')viewBiblio();else if(v==='gerador')viewGerador();else if(v==='new'){current=blankOpp();viewDetail(current);}});
main.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]'),del=e.target.closest('[data-del]'),nv=e.target.closest('[data-view]');
  if(del){e.stopPropagation();opps=opps.filter(o=>o.id!==del.dataset.del);save(opps);viewList();return;}
  if(open){const o=opps.find(x=>x.id===open.dataset.open);if(o){current=JSON.parse(JSON.stringify(o));viewDetail(current);}return;}
  if(nv){const v=nv.dataset.view;if(v==='list')viewList();else if(v==='gerador')viewGerador();else if(v==='new'){current=blankOpp();viewDetail(current);}}});
