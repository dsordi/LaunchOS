<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LaunchOS — Decisor de Viabilidade</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --nav:#0f172a; --nav-ink:#cbd5e1; --nav-active:#1e293b;
    --accent:#2563eb; --accent-soft:#dbeafe;
    --good:#15803d; --good-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
    --a:#1d4ed8; --b:#047857; --c:#7c3aed; --d:#9a3412;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .app{display:flex;min-height:100vh}
  aside{width:230px;background:var(--nav);color:var(--nav-ink);padding:20px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
  aside .brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:17px;padding:4px 8px 16px}
  aside .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:inline-block}
  aside .brand small{display:block;font-weight:400;font-size:11px;color:#64748b;margin-top:2px}
  nav a{display:block;padding:9px 11px;border-radius:8px;color:var(--nav-ink);text-decoration:none;font-size:13px;margin-bottom:2px;cursor:pointer}
  nav a:hover{background:var(--nav-active);color:#fff}
  nav a.active{background:var(--accent);color:#fff}
  nav .sec{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#475569;padding:14px 11px 5px}
  aside .foot{font-size:10.5px;color:#475569;padding:16px 10px 0;border-top:1px solid #1e293b;margin-top:16px}
  main{flex:1;padding:26px 30px;max-width:1100px}
  h1{font-size:21px;margin:0 0 3px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 3px}
  .card h2 .tag{font-size:10px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:20px;margin-left:7px;vertical-align:middle}
  .card .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
  h3.grp{font-size:13px;margin:16px 0 6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  label{display:block;font-size:12px;font-weight:600;margin:0 0 4px;color:#334155}
  label .q{font-weight:400;color:var(--muted)}
  input,select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .row-inline{display:flex;gap:8px;align-items:center}
  button{font-family:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;padding:9px 15px;cursor:pointer}
  .btn{background:var(--accent);color:#fff}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:#f8fafc}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.neutral{background:var(--bg);color:var(--muted)}
  .mark{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;vertical-align:middle}
  .mA{background:var(--a)} .mB{background:var(--b)} .mC{background:var(--c)} .mD{background:var(--d)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
  .casc{font-size:13px}
  .casc .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .casc .line.sub{color:var(--muted);font-size:12px}
  .casc .line.total{font-weight:700;border-bottom:2px solid var(--ink);border-top:1px solid var(--ink)}
  .casc .line .neg{color:var(--bad)}
  .scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
  .scen{border:1px solid var(--line);border-radius:10px;padding:12px}
  .scen h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .scen .big{font-size:20px;font-weight:700}
  .verdict{padding:14px 16px;border-radius:10px;font-size:14px;margin-bottom:14px;border:1px solid}
  .verdict.good{background:var(--good-bg);border-color:#86efac;color:#14532d}
  .verdict.warn{background:var(--warn-bg);border-color:#fcd34d;color:#713f12}
  .verdict.bad{background:var(--bad-bg);border-color:#fca5a5;color:#7f1d1d}
  .verdict b{font-size:15px}
  .alertbox{background:var(--warn-bg);border:1px solid #fcd34d;color:#713f12;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:8px}
  .party-row{display:grid;grid-template-columns:1fr 90px auto auto;gap:8px;align-items:center;margin-bottom:7px}
  .rede-row{display:grid;grid-template-columns:140px 1fr 130px 110px auto;gap:8px;align-items:center;margin-bottom:7px}
  .muted{color:var(--muted)}
  .pill-note{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
  .statbar{display:flex;gap:18px;flex-wrap:wrap;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 16px;margin:10px 0}
  .statbar .s b{display:block;font-size:18px;color:#fff} .statbar .s span{font-size:11px;color:#94a3b8}
  .biblio li{margin-bottom:7px}
  @media(max-width:720px){.app{flex-direction:column}aside{width:auto;height:auto;position:static}main{padding:18px}.scenarios{grid-template-columns:1fr}.rede-row{grid-template-columns:1fr 1fr}}
  /* pitch / relatório (adicionado) */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:1000}
  .modal{background:#fff;max-width:800px;width:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .modal-actions{position:sticky;top:0;background:#fff;display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
  .pitch{padding:22px 34px 38px}
  .pitch h1{font-size:23px;margin:0 0 3px} .pitch .lead{color:var(--muted);margin:0 0 6px}
  .pitch h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);border-bottom:2px solid var(--accent-soft);padding-bottom:4px;margin:22px 0 10px}
  .pitch ul{margin:0;padding-left:18px} .pitch li{margin-bottom:5px}
  .pitch table{width:100%;border-collapse:collapse;font-size:13px} .pitch td,.pitch th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left} .pitch th{font-size:11px;text-transform:uppercase;color:var(--muted)}
  .pitch .disc{font-size:11px;color:var(--muted);background:var(--bg);border-radius:8px;margin-top:20px;padding:12px 14px}
  @media print{ body>.app{display:none!important} .modal-overlay{position:static;background:none;padding:0;display:block;overflow:visible} .modal{box-shadow:none;max-width:none} .modal .modal-actions{display:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="dot"></span><div>LaunchOS<small>Decisor de Viabilidade</small></div></div>
    <nav id="nav">
      <div class="sec">Operação</div>
      <a data-view="list" class="active">📋 Oportunidades</a>
      <a data-view="new">➕ Nova oportunidade</a>
      <a data-view="gerador">🚀 Estrutura de lançamento</a>
      <div class="sec">Conhecimento</div>
      <a data-view="biblio">📚 Princípios da base</a>
    </nav>
    <div class="foot">
      Modelo: assinatura recorrente · sem reembolso integral.<br>Todo número é premissa <b style="color:#9a3412">[D]</b>, não previsão.<br><br>v0.2 · 2026-10-28
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ---------------- storage ---------------- */
const KEY='launchos_opps_v2';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=(a)=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
let opps=load();
let current=null;

/* ---------------- helpers ---------------- */
const brl=(n)=>isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'—';
const num=(n,d=0)=>isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const pct=(n)=>isFinite(n)?(n*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%':'—';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=(s)=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function blankOpp(){
  return {
    id:uid(), nome:'', nicho:'', hipotese:'',
    // influenciador / redes sociais
    redes:[{rede:'Instagram',handle:'',seguidores:0,engaj:0}],
    alcancePct:10, intencao:'baixa',
    // produto (SEMPRE assinatura) + política de cancelamento
    produtoNome:'', rendaVariavel:false,
    ticketMensal:300, prazoFidelidade:12, churnMensalPct:5, cancel7Pct:10, multaPct:50,
    planos:null,  // formatos de comercialização [{nome,meses,ticketMensal,mix}]
    // aquisição / leads
    optinPct:5, verbaTrafego:20000, cpl:8, qtdLeadsDB:0, custoLeadDB:1.60, convLista:2,
    // modelo
    modelo:'interno',
    // custos / regras
    taxaPlataformaPct:10, producao:5000, ferramentas:1000, outrosFixos:0,
    impostoPct:10, impostoBase:'faturamento',
    hairConserv:30, hairOtim:20,
    // revenue share
    splitBase:'lucro', recuperaInvest:false, investRecuperar:0, parceirosNote:'',
    partes:[{nome:'Nelogica',pct:100,operador:true}],
    // execução (E6/E7)
    dataCarrinho:'', plano:null,
    status:'rascunho'
  };
}

/* ---------------- motor financeiro (determinístico) ---------------- */
const seguidoresTotais=(o)=>(o.redes||[]).reduce((a,r)=>a+(+r.seguidores||0),0);
const audienciaAlcancavel=(o)=>seguidoresTotais(o)*((o.alcancePct||0)/100);

// formatos de comercialização do produto (1 produto, vários planos)
function getPlanos(o){
  if(o.planos && o.planos.length) return o.planos;
  return [{nome:'Plano único', meses:(+o.prazoFidelidade||12), ticketMensal:(+o.ticketMensal||0), mix:100}];
}
// receita por cliente de UM formato, ao longo do seu prazo, com multa sobre o restante em cancelamentos pós-janela
function recPlano(o,p){
  const t=+p.ticketMensal||0, N=Math.max(1,Math.round(+p.meses||12));
  const c=(+o.churnMensalPct||0)/100, m=(+o.multaPct||0)/100;
  let alive=1, rev=0;
  for(let month=1;month<=N;month++){
    rev += alive*t;
    if(month<N){ const ch=alive*c; rev += ch*m*t*(N-month); alive -= ch; }
  }
  return rev;
}
// receita esperada por cliente efetivo = média ponderada dos formatos pelo mix
function receitaPorCliente(o){
  const pl=getPlanos(o), tot=pl.reduce((a,p)=>a+(+p.mix||0),0)||1;
  return pl.reduce((a,p)=>a+recPlano(o,p)*((+p.mix||0)/tot),0);
}
// ticket mensal médio ponderado (para payback/CAC)
function ticketMensalBlend(o){
  const pl=getPlanos(o), tot=pl.reduce((a,p)=>a+(+p.mix||0),0)||1;
  return pl.reduce((a,p)=>a+(+p.ticketMensal||0)*((+p.mix||0)/tot),0);
}

function computeScenario(o, convMult){
  const conv=(o.convLista/100)*convMult;
  const leadsAud = audienciaAlcancavel(o)*((o.optinPct||0)/100);
  const leadsPagos = o.cpl>0 ? o.verbaTrafego/o.cpl : 0;
  const leadsDB = +o.qtdLeadsDB||0;
  const leads = leadsAud+leadsPagos+leadsDB;
  const vendas = leads*conv;
  const efetivos = vendas*(1-(o.cancel7Pct||0)/100);       // passaram dos 7 dias
  const recPorCliente = receitaPorCliente(o);
  const bruto = efetivos*recPorCliente;                    // receita contratada esperada (ao longo do termo)
  const receita = bruto;                                   // sem reembolso integral: receita = contratada
  const taxaPlat = receita*((o.taxaPlataformaPct||0)/100);
  const leadsDBCost = leadsDB*(+o.custoLeadDB||0);         // contribuição Nelogica (base de leads)
  const fixos = (+o.verbaTrafego||0)+(+o.producao||0)+(+o.ferramentas||0)+(+o.outrosFixos||0);
  const antesImp = receita - taxaPlat - fixos - leadsDBCost;
  const baseImp = o.impostoBase==='faturamento'?receita:Math.max(0,antesImp);
  const imposto = baseImp*((o.impostoPct||0)/100);
  const lucro = antesImp - imposto;
  const custosTotais = taxaPlat+fixos+leadsDBCost+imposto;
  // unit economics (assinatura) — CAC é CALCULADO (o usuário não estima)
  const custoAquisicao = (+o.verbaTrafego||0) + leadsDBCost;     // mídia + base de leads
  const cac = efetivos>0 ? custoAquisicao/efetivos : 0;
  const taxRev = o.impostoBase==='faturamento' ? ((o.impostoPct||0)/100) : 0;
  const netMensal = ticketMensalBlend(o)*(1-((o.taxaPlataformaPct||0)/100)-taxRev); // margem mensal por cliente (ponderada entre formatos)
  const paybackMeses = netMensal>0 ? cac/netMensal : Infinity;
  const ltvCac = cac>0 ? recPorCliente/cac : Infinity;
  return {conv,leadsAud,leadsPagos,leadsDB,leads,vendas,efetivos,recPorCliente,bruto,receita,taxaPlat,leadsDBCost,fixos,antesImp,imposto,lucro,custosTotais,custoAquisicao,cac,netMensal,paybackMeses,ltvCac};
}

function distribute(o,s){
  const partes=o.partes; const opIdx=Math.max(0,partes.findIndex(p=>p.operador));
  const base = o.splitBase==='receita'? s.receita : s.lucro;
  let recovered=0;
  if(o.recuperaInvest) recovered=Math.min(+o.investRecuperar||0, Math.max(0,base));
  const distributable = base - recovered;
  const nets=partes.map((p,i)=>{
    let v=distributable*((+p.pct||0)/100);
    if(i===opIdx){ v+=recovered; if(o.splitBase==='receita') v-=s.custosTotais; }
    return v;
  });
  const operadorNet=nets[opIdx]||0;
  const repasseParceiros=partes.reduce((a,p,i)=> i===opIdx?a:a+distributable*((+p.pct||0)/100),0);
  const estouro=(o.splitBase==='receita' && operadorNet<0 && s.lucro>=0);
  return {nets,operadorNet,opIdx,recovered,repasseParceiros,estouro};
}

function breakEvenConv(o){
  const base=o.convLista; if(base<=0) return null;
  const at0=computeScenario(o,0).lucro;
  const at1=computeScenario(o,1).lucro;
  const slope=(at1-at0)/base; if(slope===0) return null;
  return -at0/slope;
}

function analyze(o){
  const b=computeScenario(o,1), cons=computeScenario(o,1-(o.hairConserv/100)), otim=computeScenario(o,1+(o.hairOtim/100));
  const dB=distribute(o,b), dC=distribute(o,cons), dO=distribute(o,otim);
  const be=breakEvenConv(o);
  let verdict,vclass,vmsg;
  if(dC.operadorNet>=0){verdict='VIÁVEL (condicional)';vclass='good';vmsg='O operador fica positivo mesmo no cenário conservador. Mas os números são premissas [D] — confirme conversão, churn e alcance antes de comprometer a verba.';}
  else if(dO.operadorNet<0){verdict='NO-GO';vclass='bad';vmsg='O operador fica negativo até no cenário otimista. Redesenhar oferta/modelo/split ou interromper.';}
  else{verdict='NÃO DECIDÍVEL — TESTAR';vclass='warn';vmsg='O resultado troca de sinal entre conservador e otimista. Depende de uma premissa que você ainda não tem. Rode um teste pequeno antes de decidir.';}
  let sens=null; if(be!=null){sens={be,margem:(o.convLista-be)/o.convLista};}
  return {b,cons,otim,dB,dC,dO,be,sens,verdict,vclass,vmsg};
}

/* ---------------- views ---------------- */
const main=document.getElementById('main');
const setActive=(v)=>document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===v));

function viewList(){
  setActive('list');
  const rows = opps.length? opps.map(o=>{
    let v='—',cls='neutral'; if(o.nome||o.ticketMensal){const a=analyze(o);v=a.verdict;cls=a.vclass;}
    return `<tr class="clickable" data-open="${o.id}">
      <td><b>${esc(o.nome)||'<span class=muted>sem nome</span>'}</b><br><span class="muted">${esc(o.nicho)}</span></td>
      <td>${esc(o.produtoNome)||'—'}</td>
      <td>${brl(o.ticketMensal)}/mês</td>
      <td><span class="chip ${cls}">${v}</span></td>
      <td><button class="btn ghost sm" data-del="${o.id}">excluir</button></td></tr>`;}).join('')
    : `<tr><td colspan="5" class="muted" style="padding:22px">Nenhuma oportunidade ainda. Clique em “Nova oportunidade”.</td></tr>`;
  main.innerHTML=`<h1>Oportunidades</h1><p class="sub">De uma frase a um go/no-go defensável. Veredito pelo cenário conservador.</p>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h2 style="margin:0">Carteira</h2><button class="btn" data-view="new">➕ Nova oportunidade</button></div>
  <table><thead><tr><th>Oportunidade</th><th>Produto</th><th>Ticket mensal</th><th>Veredito</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function viewBiblio(){
  setActive('biblio');
  main.innerHTML=`<h1>Princípios da base</h1><p class="sub">Regras que o decisor respeita. Fonte e confiança sempre à vista.</p>
  <div class="card"><h2>Como ler a confiança</h2><div class="legend">
     <span><span class="mark mA">A</span> fato de fonte lida</span><span><span class="mark mB">B</span> convergência independente</span>
     <span><span class="mark mC">C</span> inferência</span><span><span class="mark mD">D</span> hipótese / premissa não validada</span></div></div>
  <div class="card biblio"><h2>Inegociáveis</h2><ul>
   <li><span class="mark mB">B</span> <b>Faturamento ≠ lucro ≠ caixa.</b> O resultado é contratado ao longo do tempo; caixa chega aos poucos (GAP-008).</li>
   <li><span class="mark mA">A</span> <b>Sem benchmark público</b> de conversão/faturamento. Toda premissa é [D], nunca default "esperado".</li>
   <li><span class="mark mC">C</span> <b>Cálculo determinístico; a IA só explica.</b> Nenhum número vem de texto de IA.</li>
   <li><span class="mark mA">A</span> <b>Seguidores ≠ audiência ≠ intenção.</b> Por isso há taxa de alcance e opt-in entre seguidores e leads.</li>
   <li><span class="mark mD">D</span> <b>Regras financeiras ambíguas são escolha sua</b> (base do split, do imposto). O app não assume em silêncio.</li>
  </ul><div class="pill-note">Documentos completos em <b>/home/user/biblioteca</b> (00–11). O leitor completo entra na versão com banco de dados.</div></div>`;
}

function field(o,label,key,opts={}){
  const t=opts.type||'number';
  if(t==='select'){const options=opts.options.map(([v,l])=>`<option value="${v}" ${o[key]==v?'selected':''}>${l}</option>`).join('');
    return `<div><label>${label} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><select data-k="${key}">${options}</select></div>`;}
  if(t==='check') return `<div><label>&nbsp;</label><div class="row-inline"><input type="checkbox" style="width:auto" data-k="${key}" ${o[key]?'checked':''}/> <span>${label}</span></div></div>`;
  const suf=opts.suffix?`<span class="muted" style="font-size:11px"> ${opts.suffix}</span>`:'';
  return `<div><label>${label}${suf} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><input type="${t}" data-k="${key}" value="${esc(o[key])}" ${t==='text'?'':'step=any'}/></div>`;
}

/* ---------------- playbook / plano de execução (E6/E7) ---------------- */
const FASES=[
  {nome:'Fase 0 · Captação',obj:'Construir e aquecer a lista (pré-pré-lançamento).'},
  {nome:'Fase 1 · Aquecimento (CPLs)',obj:'Entregar valor, ativar gatilhos e preparar a decisão.'},
  {nome:'Fase 2 · Carrinho',obj:'Abrir a oferta por tempo limitado (escassez honesta).'},
  {nome:'Fase 3 · Pós-lançamento',obj:'Entregar, reter, reconciliar previsto × realizado e aprender.'}
];

const addDays=(dateStr,d)=>{if(!dateStr)return'';const dt=new Date(dateStr+'T00:00:00');if(isNaN(dt))return'';dt.setDate(dt.getDate()+d);return dt.toLocaleDateString('pt-BR');};
const planoStats=(o)=>{const t=o.plano||[];const done=t.filter(x=>x.feito).length;return{done,total:t.length,pct:t.length?done/t.length:0};};

function renderPlanoBody(o){
  const s=analyze(o).b;
  const metas=[`alvo ≈ ${num(s.leads)} leads`,'alvo: presença/abertura altas (termômetro)',`alvo ≈ ${num(s.efetivos,0)} clientes efetivos`,'alvo: cancelamento ≤ premissa; aprendizados registrados'];
  const st=planoStats(o);
  // portão de compliance pendente?
  const compPend = o.rendaVariavel && (o.plano||[]).some(t=>t.portao && /jurídico/i.test(t.desc) && !t.feito);
  let html=`<div class="grid" style="margin-bottom:10px">
     <div><label>Data de abertura do carrinho (D0)</label><input type="date" id="dataCarrinhoInput" value="${esc(o.dataCarrinho)}"/></div>
     <div><label>Progresso geral</label><div style="padding-top:7px"><b>${st.done}/${st.total}</b> tarefas · ${pct(st.pct)}</div></div>
     <div><label>&nbsp;</label><button class="btn ghost sm" id="genPlano">↻ gerar / resetar plano padrão</button></div>
   </div>`;
  if(compPend) html+=`<div class="alertbox" style="margin-bottom:10px"><b>Portão de compliance aberto:</b> renda variável + validação jurídica não concluída → a copy não pode ser liberada.</div>`;
  [0,1,2,3].forEach(f=>{
    const tasks=(o.plano||[]).map((t,idx)=>({t,idx})).filter(x=>x.t.fase===f);
    const done=tasks.filter(x=>x.t.feito).length;
    html+=`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><b>${FASES[f].nome}</b><span class="muted" style="font-size:12px">${done}/${tasks.length} · ${metas[f]}</span></div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">${FASES[f].obj}</div>`;
    tasks.forEach(({t,idx})=>{
      const quando = o.dataCarrinho? ('📅 '+addDays(o.dataCarrinho,t.dia)) : ('dia '+(t.dia>=0?'D+'+t.dia:'D'+t.dia));
      html+=`<div style="display:grid;grid-template-columns:auto 1fr 120px 64px auto;gap:8px;align-items:center;margin-bottom:5px">
        <input type="checkbox" style="width:auto" data-tk="feito" data-ti="${idx}" ${t.feito?'checked':''}/>
        <input data-tk="desc" data-ti="${idx}" value="${esc(t.desc)}" style="${t.feito?'text-decoration:line-through;color:#94a3b8':''}"/>
        <input data-tk="resp" data-ti="${idx}" value="${esc(t.resp)}" placeholder="responsável"/>
        <input data-tk="dia" data-ti="${idx}" type="number" value="${t.dia}" title="dia relativo ao carrinho (D0)"/>
        <span style="white-space:nowrap">${t.portao?'<span class="chip warn">portão</span> ':''}<button class="btn danger sm" data-trm="${idx}">×</button></span>
        <div style="grid-column:2/6;font-size:11px;color:var(--muted);margin-top:-3px">${quando}</div>
      </div>`;
    });
    html+=`<button class="btn ghost sm" data-addtask="${f}">+ tarefa</button></div>`;
  });
  return html;
}
function bindPlano(o){
  const body=document.getElementById('planoBody'); if(!body)return;
  const refresh=()=>{document.getElementById('planoBody').innerHTML=renderPlanoBody(o);bindPlano(o);};
  body.querySelectorAll('input[data-tk]').forEach(el=>{
    const i=+el.dataset.ti,k=el.dataset.tk;
    if(k==='feito'){el.addEventListener('change',()=>{o.plano[i].feito=el.checked;refresh();});}
    else{el.addEventListener('input',()=>{o.plano[i][k]= k==='dia'?parseFloat(el.value||'0'):el.value;}); if(k==='dia')el.addEventListener('change',refresh);}
  });
  body.querySelectorAll('[data-trm]').forEach(el=>el.onclick=()=>{o.plano.splice(+el.dataset.trm,1);refresh();});
  body.querySelectorAll('[data-addtask]').forEach(el=>el.onclick=()=>{o.plano.push({fase:+el.dataset.addtask,desc:'Nova tarefa',resp:'',dia:0,portao:false,feito:false});refresh();});
  const g=document.getElementById('genPlano'); if(g)g.onclick=()=>{o.plano=defaultPlano();refresh();};
  const dc=document.getElementById('dataCarrinhoInput'); if(dc)dc.addEventListener('change',()=>{o.dataCarrinho=dc.value;refresh();});
}

  document.getElementById('addParte').onclick=()=>{o.partes.push({nome:'Nova parte',pct:0,operador:false});viewDetail(o);};
  document.getElementById('setRecLeads').onclick=()=>{o.recuperaInvest=true;o.investRecuperar=(+o.qtdLeadsDB||0)*(+o.custoLeadDB||0);viewDetail(o);};
  document.getElementById('saveBtn').onclick=()=>{o.status='salvo';const i=opps.findIndex(x=>x.id===o.id);if(i>=0)opps[i]=o;else opps.push(o);save(opps);viewList();};
  recompute(o);
  bindPlano(o);

function bindRedes(o){
  main.querySelectorAll('[data-rk]').forEach(el=>el.addEventListener('input',()=>{
    const i=+el.dataset.ri,k=el.dataset.rk;o.redes[i][k]= (k==='rede'||k==='handle')?el.value:parseFloat(el.value||'0');
    recompute(o);
  }));
  main.querySelectorAll('[data-rrm]').forEach(el=>el.onclick=()=>{const i=+el.dataset.rrm;if(o.redes.length<=1)return;o.redes.splice(i,1);viewDetail(o);});
}
function bindParties(o){
  main.querySelectorAll('[data-pk]').forEach(el=>el.addEventListener('input',()=>{const i=+el.dataset.pi,k=el.dataset.pk;o.partes[i][k]=k==='pct'?parseFloat(el.value||'0'):el.value;recompute(o);}));
  main.querySelectorAll('[data-pop]').forEach(el=>el.addEventListener('change',()=>{const i=+el.dataset.pop;o.partes.forEach((p,j)=>p.operador=(j===i));recompute(o);}));
  main.querySelectorAll('[data-prm]').forEach(el=>el.onclick=()=>{const i=+el.dataset.prm;if(o.partes.length<=1)return;const wasOp=o.partes[i].operador;o.partes.splice(i,1);if(wasOp)o.partes[0].operador=true;viewDetail(o);});
}

  const pn=document.getElementById('planosNote');

  const mh=document.getElementById('modeloHint');

  const r=analyze(o), s=r.b, d=r.dB, el=document.getElementById('results'); if(!el)return;
  const line=(l,v,neg=false)=>`<div class="line"><span>${l}</span><span class="${neg?'neg':''}">${neg&&v>0?'− ':''}${brl(v)}</span></div>`;
  const partesOut=o.partes.map((p,i)=>`<div class="line"><span>${esc(p.nome)}${i===d.opIdx?' <span class="muted">(operador)</span>':''} · ${p.pct}%</span><span class="${r.dC.nets[i]<0?'neg':''}">${brl(d.nets[i])}</span></div>`).join('');
  el.innerHTML=`<h2>Resultado <span class="tag">cenário-base · receita contratada</span></h2>

  <div class="scenarios" style="margin:14px 0 4px">

  </div>
  <div class="statbar" style="margin-top:14px">
    <div class="s"><b>${brl(s.cac)}</b><span>CAC calculado (mídia+base ÷ clientes)</span></div>

  <div class="pill-note">CAC é <b>calculado</b> (você não precisa estimar): investimento em mídia + custo da base de leads, dividido pelos clientes efetivos. Payback = CAC ÷ margem mensal por cliente. [D] — depende das premissas acima.</div>
  <div class="grid" style="margin-top:14px;align-items:start">

      <div class="line"><span>Clientes efetivos × receita/cliente (${brl(s.recPorCliente)})</span><span>${brl(s.bruto)}</span></div>
      ${line('Taxa plataforma',s.taxaPlat,true)}
      ${s.leadsDBCost>0?line('Custo base de leads Nelogica',s.leadsDBCost,true):''}
      ${line('Custos fixos (mídia+prod+ferr+outros)',s.fixos,true)}
      ${line('Imposto (base '+o.impostoBase+')',s.imposto,true)}
      <div class="line total"><span>Lucro operacional</span><span>${brl(s.lucro)}</span></div>
    </div><div class="pill-note">Receita <b>contratada</b> ao longo do termo; o caixa entra mensalmente (GAP-008). Modelo de fluxo de caixa no tempo ainda não implementado.</div></div>
    <div><h3 class="grp" style="margin-top:0">Distribuição (base: ${o.splitBase})</h3><div class="casc">
      ${o.recuperaInvest?`<div class="line"><span>Recuperação de investimento</span><span>${brl(d.recovered)}</span></div>`:''}
      ${partesOut}</div>
      <h3 class="grp">Sensibilidade</h3><div class="casc">
       <div class="line"><span>Conversão de break-even</span><span>${r.be!=null?pct(r.be/100):'—'}</span></div>
       <div class="line"><span>Sua premissa de conversão</span><span>${pct(o.convLista/100)}</span></div>
       <div class="line"><span>Folga até o zero</span><span class="${r.sens&&r.sens.margem<0.3?'neg':''}">${r.sens?pct(r.sens.margem):'—'}</span></div>
      </div>
      ${r.sens&&r.sens.margem<0.3?`<div class="alertbox">Folga pequena: variação modesta na conversão (premissa [D]) vira prejuízo. Calculável ≠ confiável — teste antes.</div>`:''}
    </div>
  </div>`;
}

let geradorProduto=null;
const blankProduto=()=>({nome:'',oqueeh:'',paraque:'',publico:'',cvp:'novo',validado:'nao',jaVende:'nao',audiencia:'fria',verba:'media',rendaVariavel:false});
function oppToProduto(o){
  const seg=seguidoresTotais(o); let aud='nenhuma'; if(seg>0) aud=(o.intencao==='baixa'?'fria':'quente');
  const v=+o.verbaTrafego||0; const verba=v>50000?'alta':(v>=10000?'media':'baixa');
  return {nome:o.nome||'',oqueeh:o.produtoNome||'',paraque:o.hipotese||'',publico:o.nicho||'',cvp:'novo',validado:o.produtoPronto==='sim'?'sim':'nao',jaVende:o.intencao==='alta'?'sim':'nao',audiencia:aud,verba,rendaVariavel:!!o.rendaVariavel};
}
function gfield(p,label,key,opts={}){
  const t=opts.type||'text';
  if(t==='select'){const o=opts.options.map(([v,l])=>`<option value="${v}" ${p[key]==v?'selected':''}>${l}</option>`).join('');return `<div><label>${label} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><select data-g="${key}">${o}</select></div>`;}
  if(t==='check')return `<div><label>&nbsp;</label><div class="row-inline"><input type="checkbox" style="width:auto" data-g="${key}" ${p[key]?'checked':''}/> <span>${label}</span></div></div>`;
  return `<div><label>${label} ${opts.q?`<span class=q>${opts.q}</span>`:''}</label><input type="text" data-g="${key}" value="${esc(p[key])}"/></div>`;
}
// regras: do produto → tipo de lançamento (matriz 03 + dependências + HYP-005)
function gerarEstrutura(p){
  const raiox=[]; const validado=p.validado==='sim', jaVende=p.jaVende==='sim', aud=p.audiencia;
  raiox.push(validado?{t:'ok',txt:'Produto validado — pode vender para a base.'}:{t:'alerta',txt:'Produto ainda não validado — risco de vender algo que o mercado não quer. Validar antes de escalar.'});
  if(aud==='nenhuma') raiox.push({t:'bloqueio',txt:'Sem audiência: é preciso construir ou emprestar lista antes de qualquer carrinho (captação é pré-requisito).'});
  else if(aud==='fria') raiox.push({t:'alerta',txt:'Audiência fria (seguidores sem intenção): aquecer e gerar sinal de intenção antes de ofertar — audiência ≠ intenção (SRC-017).'});
  else raiox.push({t:'ok',txt:'Audiência quente: há base relacionada para lançar.'});
  if(p.rendaVariavel) raiox.push({t:'bloqueio',txt:'Toca renda variável: copy e promessas passam por portão jurídico (compliance) antes de ir ao ar (GAP-003).'});
  const cvpTxt={novo:'Produto novo (introdução): foco em informar, educar e induzir a 1ª experimentação; quebra de crença forte (Kotler, CVP).',crescimento:'Em crescimento: momento de escalar alcance e defender a posição.',maduro:'Maduro: diferenciar e relançar com ângulo/bônus novo; cuidado com saturação.'};
  if(cvpTxt[p.cvp]) raiox.push({t:'info',txt:cvpTxt[p.cvp]});
  let tipo,just,alt=[];
  if(!validado){tipo='Semente';just='Produto ainda não validado → o semente valida a demanda e financia a 1ª turma com baixo risco (matriz 03; SRC-005).';alt=['Interno (após validar)'];}
  else if(aud==='nenhuma'){tipo='Captação + Semente';just='Produto pronto, mas sem audiência → construir lista primeiro; um semente pequeno gera os primeiros dados e clientes.';alt=['Interno (após formar base)'];}
  else if(validado && !jaVende){tipo='Interno';just='Produto validado + base própria → interno é o cavalo de batalha e pré-requisito para externo/perpétuo (SRC-005/008). Expert com autoridade pula o semente (HYP-005).';alt=['Relâmpago (caixa rápido)'];}
  else {if(p.verba==='alta'||aud==='fria'){tipo='Externo';just='Interno já converte → escalar alcance via afiliados/parceiros (só depois do interno validado — SRC-005/008).';alt=['Perpétuo (previsibilidade)'];}else{tipo='Perpétuo';just='Interno já converte → automatizar o que funciona para previsibilidade/fluxo diário (só após interno de sucesso).';alt=['Externo (escala)'];}}
  if(aud==='quente' && !/Relâmpago/.test(alt.join())) alt.push('Relâmpago (caixa rápido, sem abusar da frequência)');
  const publico=p.publico||'[público]', beneficio=p.paraque||'[benefício central]', produto=p.oqueeh||p.nome||'[produto]';
  const mote={frase:`Como ${publico} pode ${beneficio} — mesmo diante de [o maior obstáculo].`,
    paragrafo:`${publico} quer ${beneficio}, mas enfrenta [o problema]. ${produto} é o guia: [passo 1] → [passo 2] → [passo 3]. Em vez de [o que se perde ao não agir], você alcança [a transformação].`};
  const fases=estruturaPorTipo(tipo,p);
  const portoes=[];
  if(p.rendaVariavel) portoes.push('Compliance (renda variável): validar promessas com o jurídico antes de liberar copy.');
  portoes.push('Tracking/medição configurado ANTES de abrir a captação.');
  portoes.push('Go/no-go financeiro: cenário conservador viável para todas as partes (decidir no Decisor E5).');
  portoes.push('Fechar o carrinho na data prometida (escassez honesta).');
  return {tipo,just,alt,raiox,mote,fases,portoes};
}
function estruturaPorTipo(tipo,p){
  const base=[
    {nome:'Fase 0 · Captação (pré-pré-lançamento)',obj:'Construir/aquecer a lista e sondar a oferta',passos:[
      {acao:'Definir avatar e a grande promessa (o benefício central)',gatilho:'—',quando:'D-30'},
      {acao:'"Tiro de aviso": pergunta que abre diálogo e revela objeções',gatilho:'Reciprocidade',quando:'D-28'},
      {acao:'Isca + página de captura; subir captação ('+(p.audiencia!=='nenhuma'?'tráfego + base própria':'tráfego')+')',gatilho:'—',quando:'D-25'},
      {acao:'Configurar tracking ANTES de abrir a captação [portão]',gatilho:'—',quando:'D-25'}]},
    {nome:'Fase 1 · Aquecimento (pré-lançamento — 3 CPLs)',obj:'Entregar valor, ativar gatilhos, preparar a decisão',passos:[
      {acao:'CPL 1 — quebra de crença (história + promessa)',gatilho:'Autoridade + Expectativa',quando:'D-10'},
      {acao:'CPL 2 — transformação / prova',gatilho:'Comprovação social + Confiança',quando:'D-7'},
      {acao:'CPL 3 — ponte para a oferta',gatilho:'Reciprocidade + Comunidade',quando:'D-4'}]},
    {nome:'Fase 2 · Carrinho (lançamento)',obj:'Abrir a oferta por tempo limitado',passos:[
      {acao:'Abrir carrinho; oferta = produto + preço + garantia + bônus + razão p/ agir agora',gatilho:'Expectativa + Evento',quando:'D0'},
      {acao:'Sequência de vendas; a maioria das vendas vem nas últimas 24h',gatilho:'Escassez',quando:'D0–D+4'},
      {acao:'Fechar o carrinho na data (escassez honesta) [portão]',gatilho:'Escassez',quando:'D+5'}]},
    {nome:'Fase 3 · Pós-lançamento',obj:'Entregar, reter e aprender',passos:[
      {acao:'Onboarding; gestão da janela de 7 dias',gatilho:'—',quando:'D+6'},
      {acao:'Reconciliação previsto × realizado + registrar aprendizados [portão]',gatilho:'—',quando:'D+30'}]}
  ];
  if(/Semente/.test(tipo)) base[0].passos.unshift({acao:'Validar demanda com a 1ª turma — vender ANTES de construir',gatilho:'—',quando:'D-30'});
  if(/Externo/.test(tipo)) base[0].passos.push({acao:'Recrutar e alinhar afiliados/parceiros (só com produto que já converte)',gatilho:'Autoridade',quando:'D-20'});
  if(/Perpétuo/.test(tipo)) base[3].passos.push({acao:'Automatizar a sequência que funcionou (evergreen por lead)',gatilho:'Expectativa',quando:'D+30'});
  if(/Relâmpago/.test(tipo)) base[1].passos=[{acao:'Aquecimento curto e intenso para base quente',gatilho:'Escassez + Expectativa',quando:'D-3'}];
  return base;
}

   <p><b>Promessa:</b> ${esc(res.mote.frase)}</p><p>${esc(res.mote.paragrafo)}</p>

   <h2>5. Portões</h2><ul>${port}</ul>
   <div class="disc"><b>Transparência:</b> estrutura <b>sugerida por regras</b> a partir do que você informou, cruzando a base (Walker, StoryBrand, Kotler, matriz de tipos). Os [colchetes] são para você preencher com a realidade. Não é promessa de resultado; a viabilidade financeira é decidida no Decisor (E5).</div>`;
}

function openReport(inner,title){

function viewGerador(){

  if(!geradorProduto) geradorProduto=blankProduto();
  const p=geradorProduto;
  const oppOptions=opps.map(o=>`<option value="${o.id}">${esc(o.nome)||'(sem nome)'}</option>`).join('');
  main.innerHTML=`<h1>Estrutura de Lançamento</h1><p class="sub">Descreva o produto (do zero ou carregue uma oportunidade) e gere o raio-X + a estrutura operacional etapa por etapa.</p>
  <div class="card"><h2>Produto <span class="tag">do zero ou do portfólio</span></h2>
    <div class="grid" style="margin-bottom:12px">
      <div><label>Carregar de uma oportunidade salva</label><select id="loadOpp"><option value="">— começar do zero —</option>${oppOptions}</select></div>
    </div>
    <div class="grid">
      ${gfield(p,'Nome do produto / ideia','nome')}
      ${gfield(p,'O que é','oqueeh',{q:'em uma frase'})}
      ${gfield(p,'Para que serve (benefício central)','paraque',{q:'o cliente compra o quê?'})}
      ${gfield(p,'Público (quem é o herói)','publico')}
    </div>
    <div class="grid" style="margin-top:12px">
      ${gfield(p,'Momento no ciclo de vida','cvp',{type:'select',options:[['novo','Novo (introdução)'],['crescimento','Em crescimento'],['maduro','Maduro']]})}
      ${gfield(p,'Produto validado?','validado',{type:'select',options:[['nao','Não'],['sim','Sim']]})}
      ${gfield(p,'Já vende na base?','jaVende',{type:'select',options:[['nao','Não / pouco'],['sim','Sim, com consistência']]})}
      ${gfield(p,'Audiência disponível','audiencia',{type:'select',options:[['nenhuma','Nenhuma'],['fria','Fria (seguidores s/ intenção)'],['quente','Quente (base relacionada)']]})}
      ${gfield(p,'Verba de mídia','verba',{type:'select',options:[['baixa','Baixa'],['media','Média'],['alta','Alta']]})}
      ${gfield(p,'Toca renda variável?','rendaVariavel',{type:'check'})}
    </div>
    <div style="margin-top:14px"><button class="btn" id="genEstrut">🔎 Gerar análise + estrutura</button></div>
  </div>
  <div id="estrutOut"></div>`;
  main.querySelectorAll('[data-g]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.g;p[k]= el.type==='checkbox'?el.checked:el.value;}));
  document.getElementById('loadOpp').addEventListener('change',e=>{const id=e.target.value;if(id){const o=opps.find(x=>x.id===id);if(o){geradorProduto=oppToProduto(o);viewGerador();}}});
  document.getElementById('genEstrut').onclick=()=>{
    const res=gerarEstrutura(p);
    document.getElementById('estrutOut').innerHTML=renderEstrutura(res);
    document.getElementById('estrutPrint').onclick=()=>openReport(renderEstruturaInner(res),'Estrutura de Lançamento — '+(p.nome||p.oqueeh||''));
  };
}

/* ---------------- router ---------------- */
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const v=a.dataset.view;
  if(v==='list')viewList();else if(v==='biblio')viewBiblio();else if(v==='gerador')viewGerador();else if(v==='new'){current=blankOpp();viewDetail(current);}});
main.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]'),del=e.target.closest('[data-del]'),nv=e.target.closest('[data-view]');
  if(del){e.stopPropagation();opps=opps.filter(o=>o.id!==del.dataset.del);save(opps);viewList();return;}
  if(open){const o=opps.find(x=>x.id===open.dataset.open);if(o){current=JSON.parse(JSON.stringify(o));viewDetail(current);}return;}
  if(nv){const v=nv.dataset.view;if(v==='list')viewList();else if(v==='gerador')viewGerador();else if(v==='new'){current=blankOpp();viewDetail(current);}}});

/* ---------------- seed de exemplo (TESTE, apagável) ---------------- */
if(opps.length===0){
  const ex=blankOpp();
  ex.nome='EXEMPLO (TESTE) — apague quando quiser';
  ex.nicho='trader / mercado financeiro · demonstração';
  ex.produtoNome='Assinatura plataforma (fictício)';
  ex.hipotese='Cenário fictício só para mostrar o motor. Todos os números são premissas [D].';
  ex.redes=[{rede:'Instagram',handle:'@exemplo',seguidores:300000,engaj:3},{rede:'YouTube',handle:'@exemplo',seguidores:120000,engaj:4}];
  ex.alcancePct=10; ex.optinPct=5; ex.convLista=2;
  ex.ticketMensal=300; ex.prazoFidelidade=12; ex.churnMensalPct=5; ex.cancel7Pct=10; ex.multaPct=50;
  ex.planos=[{nome:'Mensal',meses:1,ticketMensal:300,mix:30},{nome:'Anual',meses:12,ticketMensal:250,mix:50},{nome:'Bianual',meses:24,ticketMensal:220,mix:20}];
  ex.qtdLeadsDB=5000; ex.custoLeadDB=1.60; ex.verbaTrafego=20000; ex.cpl=8;
  ex.partes=[{nome:'Expert',pct:40,operador:false},{nome:'Nelogica',pct:60,operador:true}];
  ex.status='exemplo';
  opps=[ex];save(opps);
}
viewList();
</script>
